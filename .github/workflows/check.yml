name: Figure checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - run: npm run check
      - name: Run tests
        shell: pwsh
        run: |
          $tempDir = Join-Path $env:RUNNER_TEMP 'figure-tests'
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          $env:TEMP = $tempDir
          $env:TMP = $tempDir
          npm test
