<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
    <title>Coo · 成品行走试验</title>
</head>

<body>
    <main id="root">
        <canvas id="scene"></canvas>
        <section class="hud">
            <p class="brand">Coo · 成品行走试验</p>
            <p class="status" data-status>正在载入本机模型…</p>
        </section>
        <section class="vrmDropOverlay" data-vrm-drop-overlay aria-hidden="true">
            <p>Drop .vrm</p>
            <span>VRM0 / VRM1.0</span>
        </section>
    </main>
    <span class="local-version">v0.1.0</span>
    <section class="quick-controls" aria-label="现成控制器演示"><div><strong>让它走给你看</strong><span>也可用 WASD 移动，Shift 跑步，空格跳跃。</span></div><div class="quick-buttons"><button id="demo-walk">走几步</button><button id="demo-run">跑一段</button><button id="demo-stop">停下</button><button id="demo-reset">复位</button><button id="demo-open">打开 VRM</button><button id="demo-inspector">调参</button><a href="http://127.0.0.1:4783/" target="_blank" rel="noopener">动作试验台 ↗</a><a href="/THIRD-PARTY-LICENSES.txt" target="_blank" rel="noopener">许可</a></div></section>
    <!-- Original upstream credits are retained below and in LICENSE / LOCAL.md. -->
    <img class="controlKeys" src="/images/Controls.png" alt="control keys">
    <p class="title">
        Built on the
        <a target="_blank" href="https://github.com/pmndrs/BVHEcctrl">BVHEcctrl</a> character controller by
        <a target="_blank" href="https://github.com/ErdongChen-Andrew">Andrew Chen</a>
        <br>
        Credit for
        <a target="_blank" href="https://quaternius.itch.io/universal-animation-library">Universal Animation Library</a>
        by
        <a target="_blank" href="https://x.com/quaternius">Quaternius</a>
        <br>
        Sample VRM avatars made with
        <a target="_blank" href="https://vroid.com/">VRoid Studio</a>
    </p>
    <script type="module" src="/src/main.ts"></script>

</html>
