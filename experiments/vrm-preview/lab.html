<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Coo · 手部驱动实验台</title>
  <link rel="stylesheet" href="./lab.css">
  <script type="module" src="./lab.js"></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><b>coo</b><span>手部驱动实验台</span><em>v0.1</em></div>
    <div class="bar-right"><span id="status" class="status">载入手部…</span><a href="./" class="link">返回预览 ↗</a></div>
  </header>

  <main class="grid">
    <aside class="panel">
      <h2>姿态</h2>
      <div class="presets">
        <button data-preset="open">张开</button>
        <button data-preset="relax">放松</button>
        <button data-preset="fist">握拳</button>
        <button data-preset="point">指</button>
        <button data-preset="pinch">捏</button>
        <button data-preset="thumbsUp">点赞</button>
      </div>

      <h2>手指</h2>
      <label class="row"><span>拇指</span><input id="curl-thumb" type="range" min="0" max="100" value="0"><output id="curl-thumb-value">0%</output></label>
      <label class="row"><span>食指</span><input id="curl-index" type="range" min="0" max="100" value="0"><output id="curl-index-value">0%</output></label>
      <label class="row"><span>中指</span><input id="curl-middle" type="range" min="0" max="100" value="0"><output id="curl-middle-value">0%</output></label>
      <label class="row"><span>无名</span><input id="curl-ring" type="range" min="0" max="100" value="0"><output id="curl-ring-value">0%</output></label>
      <label class="row"><span>小指</span><input id="curl-little" type="range" min="0" max="100" value="0"><output id="curl-little-value">0%</output></label>
      <label class="row"><span>对掌</span><input id="opposition" type="range" min="0" max="100" value="0"><output id="opposition-value">0%</output></label>

      <h2>腕</h2>
      <label class="row"><span>屈伸</span><input id="wrist-flex" type="range" min="-100" max="100" value="0"></label>
      <label class="row"><span>偏尺桡</span><input id="wrist-dev" type="range" min="-100" max="100" value="0"></label>

      <h2>内部状态</h2>
      <label class="row"><span>共激活</span><input id="coactivation" type="range" min="0" max="100" value="0"></label>
      <p class="hint">共激活不改变姿态，只改变受扰后的轨迹。</p>
      <label class="row"><span>牵张反射</span><input id="reflex" type="range" min="0" max="100" value="0"></label>
      <p class="hint">带 30ms 传导延迟；力矩级反馈，不污染静态姿态。</p>
    </aside>

    <section class="stage">
      <div id="viewport" class="viewport"></div>
      <div class="stage-hint">拖动查看 · 滚轮缩放暂未接入</div>
    </section>

    <aside class="panel">
      <h2>读数</h2>
      <dl class="readout">
        <dt>刚度</dt><dd id="stiffness">0</dd>
        <dt>食指掌指角</dt><dd id="angle">0°</dd>
        <dt>共激活</dt><dd id="coact">0%</dd>
      </dl>

      <h2>扰动对比</h2>
      <div class="impulse-row">
        <button id="impulse-relaxed" class="warn">放松 · 冲量</button>
        <button id="impulse-braced" class="good">绷紧 · 冲量</button>
      </div>
      <canvas id="plot" width="360" height="190"></canvas>
      <p class="hint">同一次冲量，两条曲线的差异就是"内部状态"的证据。</p>

      <div class="actions">
        <button id="clear-plot">清空曲线</button>
        <button id="reset">重置模型</button>
        <button id="export">导出状态</button>
      </div>
    </aside>
  </main>
</body>
</html>
